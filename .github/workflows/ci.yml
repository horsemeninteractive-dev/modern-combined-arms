name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build and release dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The release build stamp is the commit count, so give the checkout
          # the full history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The AI ladder and perf file are long, host-sensitive measurements. Keep
      # them out of the per-push gate; run `npm run ai:matchups` and `npm run
      # bench` on a dedicated host or nightly job.
      - name: Test suite
        run: npm test -- --exclude tests/ai-matchups.test.ts --exclude tests/perf.test.ts

      - name: Build
        run: npm run build

      - name: Release dry-run
        run: npm run release -- --dry-run --skip-tests
